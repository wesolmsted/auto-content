[project]
name = "engine"
version = "0.1.0"
description = "Auto Content Engine: cuts raw footage into beat-synced short videos and learns which styles win."
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.13",
    "anthropic>=0.40",
    "fastapi>=0.115",
    "google-api-python-client>=2.150",
    "google-auth-oauthlib>=1.2",
    "httpx>=0.27",
    "jinja2>=3.1",
    "librosa>=0.10",
    "numpy>=1.26",
    "opencv-python-headless>=4.10",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.12",
    "scenedetect>=0.6.4",
    "soundfile>=0.12",
    "sqlalchemy>=2.0",
    "typer>=0.12",
    "uvicorn>=0.32",
]

[project.scripts]
ace = "engine.cli:app"

[dependency-groups]
dev = [
    "hypothesis>=6.115",
    "mypy>=1.13",
    "pytest>=8.3",
    "respx>=0.21",
    "ruff>=0.7",
]

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "engine"
module-root = ""

[tool.uv]
# The Mac's system python 3.12 is an x86_64 (Rosetta) build with no llvmlite wheels; use uv's arm64 build.
python-preference = "only-managed"
# Only resolve releases at least two weeks old; bump deliberately.
exclude-newer = "2026-10-25T00:00:00Z"
# scenedetect depends on the GUI opencv-python, which clashes with opencv-python-headless (same cv2
# module) and needs libGL in Docker. Drop it so only the headless build is installed.
override-dependencies = ["opencv-python; sys_platform == 'never'"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["engine", "tests"]
# The local alembic/ migrations folder would otherwise make the library look first-party.
known-third-party = ["alembic"]

[tool.mypy]
strict = true
python_version = "3.12"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "googleapiclient.*",
    "google_auth_oauthlib.*",
    "librosa.*",
    "scenedetect.*",
    "soundfile.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
